services:
  db:
    image: postgres:16
    container_name: careergenie-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend-node/SQL:/docker-entrypoint-initdb.d/

volumes:
  pgdata: