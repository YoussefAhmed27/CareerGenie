version: '3.8'

services:
  # 1. Code Execution Engine
  piston:
    image: ghcr.io/engineer-man/piston
    container_name: careergenie-piston
    restart: always
    privileged: true
    expose:
      - "2000"
    volumes:
      - piston_data:/piston 
    tmpfs:
      - /tmp:exec

  # 2. Node Backend
  node-backend:
    build: ./backend-node
    container_name: careergenie-node
    env_file:
      - .env
    expose:
      - "5000"
    volumes:
      - ./backend-node:/app
      - /app/node_modules


  fastapi-orchestrator:
    image: youssef993537/careergenie-fastapi:latest
    container_name: careergenie-fastapi
    working_dir: /app
    env_file:
      - .env
    environment:
      - PISTON_API_URL=http://piston:2000/api/v2
    expose:
      - "8000"
    depends_on:
      - piston
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend-ai/main.py:/app/main.py

# 4. The Gateway (Nginx)
  nginx:
    image: nginx:alpine
    container_name: careergenie-gateway
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - node-backend
      - fastapi-orchestrator

volumes:
  piston_data:
